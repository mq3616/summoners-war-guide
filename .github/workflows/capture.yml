name: Capture licensed original
on:
  workflow_dispatch:
jobs:
  capture:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch original
        run: |
          mkdir -p capture
          curl -L --retry 2 --max-time 60 'https://forum.gamer.com.tw/C.php?bsn=26380&snA=40953' -o capture/original.html
          curl -L --retry 2 --max-time 90 'https://r.jina.ai/https://forum.gamer.com.tw/C.php?bsn=26380&snA=40953' -o capture/reader.md
          wc -c capture/*
      - uses: actions/upload-artifact@v4
        with:
          name: original-capture
          path: capture/
